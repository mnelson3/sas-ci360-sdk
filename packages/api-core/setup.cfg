[metadata]
name = sasci360apicore
version = 0.0.1
author = Mark Nelson
author_email = support@nelsongrey.com
description = Core Library for SAS Customer Intelligence 360 REST APIs
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/mnelson3/sas_ci360_api_core
project_urls = Bug Tracker = https://github.com/mnelson3/sas_ci360_api_core/issues
classifiers = Programming Language :: Python :: 3
	License :: Other/Proprietary License
	Operating System :: OS Independent

[install_requires]
package = pandas~=1.4.2
	PyJWT~=2.3.0
	requests~=2.27.1
	saspy~=4.2.0
	schedule~=1.1.0
	DateTime~=4.3
	urllib3~=1.26.9

[options]
package_dir = = src
packages = find:
python_requires = >=3.6

[options.packages.find]
where = src
